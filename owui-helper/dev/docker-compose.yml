# Run this using docker compose -f docker-compose.yml up
services:
  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - owui-cookies-volume:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT}:8080
    env_file:
      - .env.shared
    environment:
      - WEBUI_AUTH=${WEBUI_AUTH}
      - OFFLINE_MODE=${OFFLINE_MODE}
      - WEBUI_NAME=${WEBUI_NAME}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      # - OPENAI_API_KEY=${PROXY_API_KEY}
      - TASK_MODEL_EXTERNAL=${TASK_MODEL_EXTERNAL}
      - DEFAULT_MODELS=${DEFAULT_MODELS}
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API}
      - ENABLE_COMMUNITY_SHARING=${ENABLE_COMMUNITY_SHARING}
      - ENABLE_MESSAGE_RATING=${ENABLE_MESSAGE_RATING}
      - ENABLE_TAGS_GENERATION=${ENABLE_TAGS_GENERATION}
      - RAG_EMBEDDING_ENGINE=${RAG_EMBEDDING_ENGINE}
      # - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL}
      - AUDIO_STT_ENGINE=${AUDIO_STT_ENGINE}
      # - AUDIO_TTS_ENGINE=${AUDIO_TTS_ENGINE}
      # - AUDIO_TTS_OPENAI_API_BASE_URL=${AUDIO_TTS_OPENAI_API_BASE_URL}
      # - AUDIO_TTS_OPENAI_API_KEY=${AUDIO_TTS_OPENAI_API_KEY}
      # - AUDIO_TTS_MODEL=${AUDIO_TTS_MODEL}
      # - AUDIO_TTS_VOICE=${AUDIO_TTS_VOICE}
    
    
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"

volumes:
  owui-cookies-volume: {}
